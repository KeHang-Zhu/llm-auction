  service_name: anthropic
  temperature: 0.5
prompt:
  strategy_type: plan_reflection
  prompt_dir: Prompt/
  rule_template_dir: rule_template/V10/
  include_payment_example: true
execution:
  repetitions: 50
  parallel: true
  max_workers: 5
