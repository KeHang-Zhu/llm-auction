# Axis 2: Forward Planning - Explicit Backward Induction

experiment:
  name: "axis2_forward_backward_induct"
  version: "V12"
  description: "Axis 2 Treatment - Explicitly prompt backward induction"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "axis2_forward_backward_induct.txt"

value:
  common_range: [20, 49]
  private_range: 49
  increment: 0.1
  seed_base: 1299

llm:
  model: "claude-3-5-haiku-20241022"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/V12/"
  include_payment_example: true

execution:
  repetitions: 30
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/V12/intervention_claude/axis2_forward_backward_induct"
