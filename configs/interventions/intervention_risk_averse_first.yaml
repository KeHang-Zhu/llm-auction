# Intervention Risk Averse - First Price Auction

experiment:
  name: "intervention_risk_averse_first"
  version: "V12"
  description: "Intervention Risk Averse - First Price Auction"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "first"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "first_price_interventions/intervention_risk_averse.txt"

value:
  common_range: [20, 49]
  private_range: 49
  increment: 0.1
  seed_base: 1299

llm:
  model: "gpt-4o"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/V12/"
  include_payment_example: true

execution:
  repetitions: 100
  parallel: false
  max_workers: 4
  output_dir: "experiment_logs/V12/intervention_risk_averse_first"
