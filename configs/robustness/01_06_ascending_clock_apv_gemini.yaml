# Ascending Clock Auction with Affiliated Private Values - Gemini 1.5 Flash

experiment:
  name: "ascending_clock_apv_gemini"
  version: "V10"
  description: "Ascending Clock Auction with Affiliated Private Values (Gemini 1.5 Flash)"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "clock"
  ascend_descend: "ascend"
  price_order: "second"
  private_value: "affiliated"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "affiliated_ac.txt"

value:
  common_range: [20, 79]
  private_range: 99
  increment: 1
  seed_base: 1399  # 1399 for affiliated

llm:
  model: "gemini-2.0-flash"
  service_name: "google"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/V10/"

execution:
  repetitions: 5
  parallel: false
  max_workers: 4
  output_dir: "robustness_logs/V10/ascending_clock_apv_gemini"
