experiment:
  name: ascending_clock_apv_gpt5mini
  version: V10
  description: Ascending Clock Auction with Affiliated Private Values (GPT-5-mini)
auction:
  number_agents: 3
  rounds: 1
rule:
  seal_clock: clock
  ascend_descend: ascend
  price_order: second
  private_value: affiliated
  open_blind: open
  closing: false
  reserve_price: 0
  special_name: affiliated_ac.txt
value:
  common_range: [0, 29]
  private_range: 20
  increment: 0.1
  seed_base: 1399  # 1399 for affiliated

llm:
  model: gpt-5-mini
  temperature: 0.5
prompt:
  strategy_type: plan_reflection
  prompt_dir: Prompt/
  rule_template_dir: rule_template/V10/
execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: robustness_logs/V10/ascending_clock_apv_gpt5mini
