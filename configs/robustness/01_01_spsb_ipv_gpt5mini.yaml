# SPSB with IPV - GPT-5-mini

experiment:
  name: "spsb_ipv_gpt5mini"
  version: "V10"
  description: "Second-Price Sealed Bid with Independent Private Values (GPT-5-mini)"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "private_second_price.txt"

value:
  common_range: [10, 49]
  private_range: 49
  increment: 0.1
  seed_base: 1299

llm:
  model: "gpt-5-mini"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/V10/"

execution:
  repetitions: 5
  parallel: false
  max_workers: 4
  output_dir: "robustness_logs/V10/spsb_ipv_gpt5mini"
