# All-Pay Auction with Independent Private Values

experiment:
  name: "all_pay_ipv"
  version: "V10"
  description: "All-Pay Auction with Independent Private Values"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "allpay"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "private_all_pay_v2.txt"

value:
  common_range: [20, 79]
  private_range: 99
  increment: 1
  seed_base: 1299

llm:
  model: "gpt-4o"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/V10/"

execution:
  repetitions: 5
  parallel: false
  max_workers: 4
  output_dir: "experiment_logs/V10/all_pay_ipv"
