# Amazon-style Proxy Bidding - Reserve Price 50

experiment:
  name: "amazon_reserve_50"
  version: "V10"
  description: "Amazon-style Proxy Bidding with Reserve Price 50"

auction:
  number_agents: 3
  rounds: 15

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: true  # Amazon has soft closing rule
  reserve_price: 50
  special_name: "private_second_price.txt"

value:
  common_range: [20, 79]
  private_range: 99
  increment: 1
  seed_base: 1299

llm:
  model: "gpt-4o"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/V10/"

execution:
  repetitions: 5
  parallel: false
  max_workers: 4
  output_dir: "experiment_logs/V10/amazon_reserve_50"
