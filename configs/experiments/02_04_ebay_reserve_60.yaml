# eBay-style Proxy Bidding - Reserve Price 60

experiment:
  name: "ebay_reserve_60"
  version: "V10"
  description: "eBay-style Proxy Bidding with Hidden Reserve Price 60"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false  # eBay does not have soft closing
  reserve_price: 60
  special_name: "ebay_t4_closing_rule_with_hidden_reserve.txt"
  turns: 10
  start_price: 0

value:
  common_range: [20, 79]
  private_range: 99
  increment: 1
  seed_base: 1299

llm:
  model: "gpt-4"
  temperature: 0.5

prompt:
  strategy_type: "ebay"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/V10/"

execution:
  repetitions: 5
  parallel: false
  max_workers: 4
  output_dir: "experiment_logs/V10/ebay_reserve_60"
