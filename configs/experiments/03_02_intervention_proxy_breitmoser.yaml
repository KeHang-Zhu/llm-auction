# Intervention: Clock Auction Described as Proxy Bidding (Breitmoser)

experiment:
  name: "intervention_proxy_breitmoser"
  version: "V10"
  description: "Intervention Study - Clock auction described as proxy bidding (Breitmoser)"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "clock"
  ascend_descend: "ascend"
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "intervention_proxy_breitmoser.txt"

value:
  common_range: [20, 79]
  private_range: 99
  increment: 1
  seed_base: 1299

llm:
  model: "gpt-4o"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/V10/"

execution:
  repetitions: 5
  parallel: false
  max_workers: 4
  output_dir: "experiment_logs/V10/intervention_proxy_breitmoser"
