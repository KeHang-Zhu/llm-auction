# eBay-style Proxy Bidding - No Reserve Price

experiment:
  name: "ebay_reserve_0"
  version: "V10"
  description: "eBay-style Proxy Bidding with No Reserve Price"

auction:
  number_agents: 3
  rounds: 1  # eBay is typically single round with multiple time periods

rule:
  seal_clock: "seal"  # dynamically similar to seal mechanism
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false  # eBay does not have soft closing
  reserve_price: 0
  special_name: "ebay_t1_proxy.txt"
  turns: 10  # number of time periods in eBay auction
  start_price: 0

value:
  common_range: [20, 79]
  private_range: 99
  increment: 1
  seed_base: 1299

llm:
  model: "gpt-4"  # eBay experiments use gpt-4
  temperature: 0.5

prompt:
  strategy_type: "ebay"  # use specialized eBay prompt strategy
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/V10/"

execution:
  repetitions: 5
  parallel: false
  max_workers: 4
  output_dir: "experiment_logs/V10/ebay_reserve_0"
