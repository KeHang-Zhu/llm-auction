# Intervention: Risk Neutrality Suggestion

experiment:
  name: "intervention_risk_neutrality"
  version: "V10"
  description: "Intervention Study - Suggesting risk-neutral behavior"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "intervention_risk_neutrality.txt"  # Suggests risk-neutral bidding

value:
  common_range: [20, 79]
  private_range: 99
  increment: 1
  seed_base: 1299

llm:
  model: "gpt-4o"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/V10/"

execution:
  repetitions: 5
  parallel: false
  max_workers: 4
  output_dir: "experiment_logs/V10/intervention_risk_neutrality"
