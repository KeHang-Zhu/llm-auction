# Intervention: Wrong Strategy Reveal Test

experiment:
  name: "intervention_wrong_strategy"
  version: "V10"
  description: "Intervention Study - Testing response to incorrect strategy suggestions"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "intervention_wrong_strat_reveal.txt"

value:
  common_range: [20, 79]
  private_range: 49
  increment: 0.1
  seed_base: 1299

llm:
  model: "gpt-5-mini"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/V10/"
  include_payment_example: true
execution:
  repetitions: 30
  parallel: false
  max_workers: 4
  output_dir: "experiment_logs/V10/intervention_gpt5/intervention_wrong_strategy"
