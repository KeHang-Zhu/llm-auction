# E4 fidelity cell for Gemma-3-27B — cloned from the gpt5mini robustness battery, 2026-07-08; routed via OpenRouter.
experiment:
  name: common_value_second_gemini
  version: V10
  description: Second-Price Auction with Common Value (Winner's Curse) - gpt5mini
auction:
  number_agents: 3
  rounds: 1
rule:
  seal_clock: seal
  ascend_descend: ascend
  price_order: second
  private_value: common
  open_blind: open
  closing: false
  reserve_price: 0
  special_name: common_spsb.txt
value:
