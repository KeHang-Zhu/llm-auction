  private_range: 20
  increment: 0.1
  seed_base: 1299
llm:
  model: google/gemma-3-27b-it
  service_name: open_router
  temperature: 0.5
prompt:
  strategy_type: plan_reflection
  prompt_dir: Prompt/
  rule_template_dir: rule_template/V10/
  include_payment_example: true
execution:
  repetitions: 30
  parallel: false
  max_workers: 4
  output_dir: robustness_logs/common_value_second_gemma27b
