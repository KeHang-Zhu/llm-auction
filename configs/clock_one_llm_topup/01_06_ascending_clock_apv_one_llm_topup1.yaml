# Top-up batch for the open clock: 15 extra auctions (seeds 1369-1383, continuing the main batch's 1319-1368),
# written to the same cell directory. Rule: add batches of 15 until the cell has at least 30 uncensored LLM exits.
# Generated from configs/clock/01_06_ascending_clock_apv.yaml: one LLM bidder (Andy) and two programmed
# opponents who stay while the next price does not exceed their value.
experiment:
  name: ascending_clock_apv_one_llm
  version: V10
  description: Ascending Clock Auction with Affiliated Private Values | one LLM bidder,
    two truthful programmed opponents
auction:
  number_agents: 3
  rounds: 1
rule:
  seal_clock: clock
  ascend_descend: ascend
  price_order: second
  private_value: affiliated
  open_blind: open
  closing: false
  reserve_price: 0
  special_name: affiliated_ac.txt
  programmed_opponents: true
  opponent_strategy: truthful
  llm_bidder_index: 0
  observe_after_win: true
value:
  common_range:
  - 0
  - 29
  private_range: 20
  increment: 0.5
  seed_base: 1369
llm:
  model: gpt-4o
  temperature: 0.5
prompt:
  strategy_type: plan_reflection
  prompt_dir: Prompt/
  rule_template_dir: rule_template/V10/
  include_payment_example: true
execution:
  repetitions: 15
  parallel: true
  max_workers: 5
  output_dir: experiment_logs/clock_one_llm/ascending_clock_apv_one_llm
  survey_retries: 8
