# FRONTIER battery cell — generated 2026-07 per plan/FRONTIER_RUNBOOK.md.
# Cloned from configs_da/gpt4o/da_direct_textbook_sp.yaml; only the llm block and output_dir changed.

experiment:
  name: "da_direct_textbook_sp"
  version: "V1"
  description: "Direct revelation DA with textbook strategyproofness statement"

da:
  number_students: 4
  number_schools: 4

mechanism:
  mechanism_type: "direct"
  intervention_type: "textbook_sp"
  special_name: "da_direct_textbook_sp.txt"

value:
  common_range: [40, 70]
  private_range: 20
  seed_base: 3000

llm:
  # VERIFY-MODEL-ID: confirm the exact Google API id (gemini-2.5-flash) is served
  # through edsl's google service in the installed edsl version, before launching.
  model: "google/gemini-2.5-flash"
  service_name: "open_router"  # routed via OpenRouter (no native key on this machine, 2026-07-08)
  temperature: 0.5
prompt:
  templates_dir: "rule_template/DA/"

global_ranking:
  strategy: "fixed"

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/da/gemini25flash/direct_textbook_sp"
