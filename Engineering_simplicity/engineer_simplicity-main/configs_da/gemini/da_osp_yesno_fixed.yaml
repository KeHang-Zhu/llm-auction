# DA OSP - Yes/No Interface

experiment:
  name: "da_osp_yesno"
  version: "V1"
  description: "OSP sequential interface with yes/no questions"

da:
  number_students: 4
  number_schools: 4

mechanism:
  mechanism_type: "osp"
  intervention_type: "osp_yesno"
  special_name: "da_osp_yesno_guaranteed.txt"

value:
  common_range: [40, 70]
  private_range: 20
  seed_base: 3000

llm:
  model: gemini-2.0-flash
  service_name: google
  temperature: 0.5

prompt:
  templates_dir: "rule_template/DA/"

global_ranking:
  strategy: "fixed"

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/da/gemini/osp_yesno_fixed"
