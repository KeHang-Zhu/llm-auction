# DA Direct Revelation - Axis 1 Worstcase

experiment:
  name: "da_axis1_worstcase"
  version: "V1"
  description: "Direct revelation DA with worst-case obtainable set focus"

da:
  number_students: 4
  number_schools: 4

mechanism:
  mechanism_type: "direct"
  intervention_type: "axis1_worstcase"
  special_name: "axis1_da_worstcase.txt"

value:
  common_range: [40, 70]
  private_range: 20
  seed_base: 3000

llm:
  model: gemini-2.0-flash
  service_name: google
  temperature: 0.5

prompt:
  templates_dir: "rule_template/DA/"

global_ranking:
  strategy: "fixed"

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/da/gemini/axis1_worstcase"
