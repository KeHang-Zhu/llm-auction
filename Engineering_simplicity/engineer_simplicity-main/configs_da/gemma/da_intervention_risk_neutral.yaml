# DA Risk Preference - Risk Neutral

experiment:
  name: "da_intervention_risk_neutral"
  version: "V1"
  description: "DA with risk neutral persona"

da:
  number_students: 4
  number_schools: 4

mechanism:
  mechanism_type: "direct"
  intervention_type: "risk_neutral"
  special_name: "intervention_risk_neutral.txt"

value:
  common_range: [40, 70]
  private_range: 20
  seed_base: 3000

llm:
  model: "google/gemma-3-27b-it"
  temperature: 0.5

prompt:
  templates_dir: "rule_template/DA/"

global_ranking:
  strategy: "fixed"

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/da/gemma/intervention_risk_neutral"
