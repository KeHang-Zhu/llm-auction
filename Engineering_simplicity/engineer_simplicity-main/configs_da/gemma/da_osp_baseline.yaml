# DA OSP Mechanism - Baseline Configuration

experiment:
  name: "da_osp_baseline"
  version: "V1"
  description: "OSP mechanism DA with sequential choice queries"

da:
  number_students: 4
  number_schools: 4

mechanism:
  mechanism_type: "osp"
  intervention_type: "baseline"
  special_name: "da_osp_choice.txt"

value:
  common_range: [40, 70]
  private_range: 20
  seed_base: 3000

llm:
  model: "google/gemma-3-27b-it"
  temperature: 0.5

prompt:
  templates_dir: "rule_template/DA/"

global_ranking:
   strategy: "fixed" 

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/da/gemma/osp_baseline"
