# DA Direct Revelation - Axis 1 Backward Induction

experiment:
  name: "da_axis1_backward_induct"
  version: "V1"
  description: "Direct revelation DA with backward induction prompt"

da:
  number_students: 4
  number_schools: 4

mechanism:
  mechanism_type: "direct"
  intervention_type: "axis1_backward_induct"
  special_name: "axis1_da_backward_induct.txt"

value:
  common_range: [40, 70]
  private_range: 20
  seed_base: 3000

llm:
  model: "google/gemma-3-27b-it"
  temperature: 0.5

prompt:
  templates_dir: "rule_template/DA/"

global_ranking:
  strategy: "fixed"

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/da/gemma/axis1_backward_induct"
