# DA Loss Aversion - Gain Frame

experiment:
  name: "da_loss_aversion_gain_frame"
  version: "V1"
  description: "DA with gain framing for loss aversion testing"

da:
  number_students: 4
  number_schools: 4

mechanism:
  mechanism_type: "direct"
  intervention_type: "loss_aversion_gain"
  special_name: "loss_aversion_gain_frame.txt"

value:
  common_range: [40, 70]
  private_range: 20
  seed_base: 3000

llm:
  model: claude-3-5-haiku-20241022
  service_name: anthropic
  temperature: 0.5

prompt:
  templates_dir: "rule_template/DA/"

global_ranking:
  strategy: "fixed"

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/da/claude/loss_aversion_gain_frame"
