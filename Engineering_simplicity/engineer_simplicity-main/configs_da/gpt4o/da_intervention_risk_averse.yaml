# DA Risk Preference - Risk Averse

experiment:
  name: "da_intervention_risk_averse"
  version: "V1"
  description: "DA with risk averse persona"

da:
  number_students: 4
  number_schools: 4

mechanism:
  mechanism_type: "direct"
  intervention_type: "risk_averse"
  special_name: "intervention_risk_averse.txt"

value:
  common_range: [40, 70]
  private_range: 20
  seed_base: 3000

llm:
  model: "gpt-4o"
  temperature: 0.5

prompt:
  templates_dir: "rule_template/DA/"

global_ranking:
  strategy: "fixed"

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/da/gpt4o/intervention_risk_averse"
