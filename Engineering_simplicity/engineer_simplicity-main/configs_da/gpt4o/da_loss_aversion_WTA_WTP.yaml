# DA Loss Aversion - WTA vs WTP

experiment:
  name: "da_loss_aversion_WTA_WTP"
  version: "V1"
  description: "DA with WTA vs WTP comparison for loss aversion testing"

da:
  number_students: 4
  number_schools: 4

mechanism:
  mechanism_type: "direct"
  intervention_type: "loss_aversion_wta_wtp"
  special_name: "loss_aversion_WTA_WTP.txt"

value:
  common_range: [40, 70]
  private_range: 20
  seed_base: 3000

llm:
  model: "gpt-4o"
  temperature: 0.5

prompt:
  templates_dir: "rule_template/DA/"

global_ranking:
  strategy: "fixed"

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/da/gpt4o/loss_aversion_WTA_WTP"
