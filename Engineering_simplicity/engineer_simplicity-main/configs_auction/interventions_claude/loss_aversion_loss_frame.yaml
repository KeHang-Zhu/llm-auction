# Loss Aversion - Loss Frame

experiment:
  name: "loss_aversion_loss_frame"
  version: "V12"
  description: "Loss Aversion Treatment - Outcomes framed as losses from endowment"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "loss_aversion_loss_frame.txt"

value:
  common_range: [0, 29]
  private_range: 49
  increment: 0.1
  seed_base: 1299

llm:
  model: "claude-3-5-haiku-20241022"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/auctions/"
  include_payment_example: true

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/claude/loss_aversion_loss_frame"
