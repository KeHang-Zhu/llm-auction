# Intervention: Risk Neutrality Suggestion

experiment:
  name: "intervention_risk_neutrality"
  version: "V10"
  description: "Intervention Study - Suggesting risk-neutral behavior"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "intervention_risk_neutral.txt"  # Suggests risk-neutral bidding

value:
  common_range: [0, 29]
  private_range: 49
  increment: 0.1
  seed_base: 1299

llm:
  model: "gemini-2.0-flash"
  service_name: "google"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: rule_template/auctions/
  include_payment_example: true

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/gemini/risk_neutrality"
