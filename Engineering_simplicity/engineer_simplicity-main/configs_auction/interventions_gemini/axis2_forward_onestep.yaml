# Axis 2: Forward Planning - One-Step Decision

experiment:
  name: "axis2_forward_onestep"
  version: "V12"
  description: "Axis 2 Treatment - Frame as one-step decision (reduces complexity)"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "axis2_forward_onestep.txt"

value:
  common_range: [20, 49]
  private_range: 49
  increment: 0.1
  seed_base: 1299

llm:
  model: "gemini-2.0-flash"
  service_name: google
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir:  rule_template/auctions/
  include_payment_example: true

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/gemini/axis2_forward_onestep"
