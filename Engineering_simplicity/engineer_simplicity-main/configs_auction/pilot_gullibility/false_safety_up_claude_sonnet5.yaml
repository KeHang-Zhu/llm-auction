# Axis 2: Forward Planning - One-Step Decision

experiment:
  name: "pilot_false_safety_up"
  version: "V12"
  description: "GULLIBILITY PILOT (up): false safety invariant; truth-mirrored template; 2026-07-10"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "pilot_false_safety_up.txt"

value:
  common_range: [0, 29]
  private_range: 49
  increment: 0.1
  seed_base: 1299

llm:
  model: "anthropic/claude-sonnet-5"
  service_name: "open_router"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/auctions/"
  include_payment_example: true

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/claude_sonnet5/pilot_false_safety_up"
