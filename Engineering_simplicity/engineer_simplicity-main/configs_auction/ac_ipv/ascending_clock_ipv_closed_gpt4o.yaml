# E2 identification cell — IPV ascending clock (closed), generated 2026-07-08.
# Cloned from configs_auction/acb/ascending_clock_closed_*.yaml with three changes:
#   (1) special_name -> private_ac_closed.txt (IPV description; the acb cells describe APV while drawing IPV),
#   (2) common_range -> [0, 0] (pure IPV; draw_value uses common=0 for private_value: "private" anyway),
#   (3) K=50 (pinned), llm routed via OpenRouter (incumbent snapshot ids; native keys unavailable on this machine).

experiment:
  name: "ascending_clock_ipv_closed"
  version: "V10"
  description: "Ascending Clock Auction with Independent Private Values (Closed) - E2"

auction:
  number_agents: 3
  rounds: 1
  use_survey: true
  survey_price_points: 15

rule:
  seal_clock: "clock"
  ascend_descend: "ascend"
  price_order: "second"
  private_value: "private"
  open_blind: "blind"  # blind = closed (no dropout information shown)
  closing: false
  reserve_price: 0
  special_name: "private_ac_closed.txt"

value:
  common_range: [0, 1]  # unused under private_value: "private" (common=0 in draw_value); [0,1] passes config validation and caps the clock at 50
  private_range: 49
  increment: 0.5
  seed_base: 1299

llm:
  model: "openai/gpt-4o-2024-08-06"
  temperature: 0.5
  service_name: "open_router"

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: rule_template/auctions/
  include_payment_example: true
execution:
  repetitions: 50
  parallel: true
  max_workers: 2
  output_dir: "experiment_logs/gpt4o/ascending_clock_ipv_closed"
