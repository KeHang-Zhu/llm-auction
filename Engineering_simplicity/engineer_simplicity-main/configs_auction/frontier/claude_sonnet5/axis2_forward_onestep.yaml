# FRONTIER battery cell — generated 2026-07 per plan/FRONTIER_RUNBOOK.md.
# Cloned from configs_auction/interventions_gpt4o/axis2_forward_onestep.yaml; only the llm block and output_dir changed.
# Role in merged ranking: Payoff Safety (rung B2).

experiment:
  name: "axis2_forward_onestep"
  version: "V12"
  description: "Axis 2 Treatment - Frame as one-step decision (reduces complexity)"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "axis2_forward_onestep.txt"

value:
  common_range: [0, 29]
  private_range: 49
  increment: 0.1
  seed_base: 1299

llm:
  # Exact Anthropic API model id (current-generation Sonnet; aliases carry no date suffix).
  model: "anthropic/claude-sonnet-5"
  service_name: "open_router"  # routed via OpenRouter (no native key on this machine, 2026-07-08)
  temperature: 0.5
prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/auctions/"
  include_payment_example: true

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/claude_sonnet5/axis2_forward_onestep"
