# FRONTIER battery cell — generated 2026-07 per plan/FRONTIER_RUNBOOK.md.
# Cloned from configs_auction/interventions_gpt4o/intervention_menu.yaml; only the llm block and output_dir changed.
# Role in merged ranking: Menu restatement (rung B1).

experiment:
  name: "intervention_menu"
  version: "V12"
  description: "Intervention Study - Menu-style auction description"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"    # no use for seal, place holder
  price_order: "second"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "intervention_menu.txt"

value:
  common_range: [0, 29]
  private_range: 49
  increment: 0.1
  seed_base: 1299

llm:
  # Same pattern as configs/robustness/*_gpt5mini.yaml (no service_name -> edsl default openai).
  # Note: the gpt-5-mini API ignores the temperature parameter (see appendix_ablations footnote).
  model: gpt-5-mini
  temperature: 0.5
prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/auctions/"
  include_payment_example: true

execution:
  repetitions: 50
  parallel: true
  max_workers: 4
  output_dir: "experiment_logs/gpt5mini/intervention_menu"
