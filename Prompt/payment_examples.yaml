first: |
  If you bid X and your bid is the highest, you win and pay X. If you bid X but another bidder offers more than X, you lose and pay nothing.
  Example (Win case; illustration only) Your private value for this item is $43. <ACTION> [28.8] </ACTION> (Example revealed bids after the auction: you=28.8, other bidders=24.1 and 19.7 → you win, pay 28.8.)
  Example (Lose case; illustration only) Your private value for this item is $43. <ACTION> [28.8] </ACTION> (Example revealed bids after the auction: you=28.8, other bidders=31.2 and 17.5 → you lose, pay nothing.)
second: |
  If you bid X and the highest competing bid is X-10, you win and pay X-10. If another bidder offers more than X, you lose and pay nothing.
  Example (Second-price; Win case; illustration only) Your private value for this item is $43. <ACTION> [30.0] </ACTION> (Example revealed bids after the auction: you=30.0, other bidders=20.0 and 12.5 → you win, pay 20.0 (highest competing bid).)
  Example (Second-price; Lose case; illustration only) Your private value for this item is $43. <ACTION> [30.0] </ACTION> (Example revealed bids after the auction: you=30.0, other bidders=31.2 and 18.0 → you lose, pay nothing.)
third: |
  If you bid X and other bids are X-5 and X-10, you win and pay X-10 (the third-highest bid). If someone bids above X, you lose and pay nothing.
  Example (Third-price; Win case; illustration only) Your private value for this item is $43. <ACTION> [30.0] </ACTION> (Example revealed bids after the auction: you=30.0, other bidders=25.0 and 20.0 → you win, pay 20.0 (third-highest bid).)
  Example (Third-price; Lose case; illustration only) Your private value for this item is $43. <ACTION> [30.0] </ACTION> (Example revealed bids after the auction: you=30.0, other bidders=31.0 and 22.0 → you lose, pay nothing.)
allpay: |
  If you bid X, you pay X whether you win or lose. If you win, your payoff is your value for the good minus X; if you lose, you still pay X.
clock_open: |
  If you stay in until the price reaches X and everyone else has dropped out, you win and pay X. If you drop at price X while another bidder stays in, you lose and pay nothing.
clock_closed: |
  If you stay in until the price reaches X and everyone else has dropped out, you win and pay X. If you drop at price X while another bidder stays in, you lose and pay nothing. You will not be told when other bidders drop.
